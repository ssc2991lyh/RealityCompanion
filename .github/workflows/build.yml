name: Build APK

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle Wrapper
      run: |
        echo '#!/bin/sh' > gradlew
        echo 'exec /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17.0.20-1/x64/bin/java org.gradle.wrapper.GradleWrapperMain "$@"' >> gradlew
        chmod +x gradlew
        cat gradle/wrapper/gradle-wrapper.properties

    - name: Build Debug APK
      run: |
        ./gradlew assembleDebug --stacktrace --info
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk

    - name: Check APK exists
      run: |
        ls -la app/build/outputs/apk/debug/ 2>&1 || echo 'no apk dir'
        find . -name '*.apk' 2>&1 || echo 'no apk found'

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk

name: Build APK

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 34
        build-tools: '34.0.0'
        ndk: '25.2.9519653'
        cmake: '3.22.1'

    - name: Build Debug APK
      run: gradle assembleDebug --stacktrace --info

    - name: Check APK exists
      run: |
        ls -la app/build/outputs/apk/debug/ 2>&1 || echo 'no apk dir'
        find . -name '*.apk' 2>&1 || echo 'no apk found'

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk

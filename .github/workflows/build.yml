name: Build APK

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Android SDK
      run: |
        echo "Installing Android SDK..."
        sudo apt-get update -qq
        sudo apt-get install -y -qq unzip wget
        mkdir -p /opt/android-sdk/cmdline-tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
        echo "Downloaded: $(ls -la /tmp/cmdline-tools.zip)"
        unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
        mv /tmp/cmdline-tools/cmdline-tools /opt/android-sdk/cmdline-tools/latest
        export ANDROID_HOME=/opt/android-sdk
        export PATH=$PATH:/opt/android-sdk/cmdline-tools/latest/bin
        yes | sdkmanager --licenses > /dev/null
        sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
        echo "SDK installed:"
        ls -la /opt/android-sdk/build-tools/
        ls -la /opt/android-sdk/platforms/

    - name: Download gradlew
      run: |
        curl -s https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradle/wrapper/gradle-wrapper.sh -o gradlew
        chmod +x gradlew
        ls -la gradlew
        wc -c gradlew

    - name: Build Debug APK
      run: |
        export ANDROID_HOME=/opt/android-sdk
        export PATH=$PATH:/opt/android-sdk/cmdline-tools/latest/bin
        ./gradlew assembleDebug --stacktrace --no-daemon --info

    - name: Check APK
      run: |
        ls -la app/build/outputs/apk/debug/ 2>&1 || true
        find . -name "*.apk" -type f 2>&1 || true

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: ignore

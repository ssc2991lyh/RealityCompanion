name: Build APK

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Android SDK
      run: |
        mkdir -p /opt/android-sdk/cmdline-tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
        unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
        mv /tmp/cmdline-tools/cmdline-tools /opt/android-sdk/cmdline-tools/latest
        export ANDROID_HOME=/opt/android-sdk
        echo 'ANDROID_HOME=/opt/android-sdk' >> $GITHUB_ENV
        echo 'PATH=$PATH:/opt/android-sdk/cmdline-tools/latest/bin' >> $GITHUB_ENV
        yes | sdkmanager --licenses > /dev/null
        sdkmanager 'platforms;android-34' 'build-tools;34.0.0'

    - name: Fix gradlew
      run: |
        curl -s https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradle/wrapper/gradle-wrapper.sh -o gradlew
        chmod +x gradlew
        cat gradle/wrapper/gradle-wrapper.properties

    - name: Build Debug APK
      run: |
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
